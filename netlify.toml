[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Estes cabeçalhos só chegam aos arquivos de public/ (ex.: /llms.txt). Para as páginas
# renderizadas pelo Next, a fonte da verdade da CSP é o next.config.ts. As duas regras
# precisam andar juntas: ao mudar uma, mude a outra.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.google.com https://*.doubleclick.net https://www.googleadservices.com https://connect.facebook.net https://www.facebook.com https://analytics.tiktok.com https://sc-static.net https://www.youtube.com https://s.ytimg.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://cdn.shopify.com https://www.bubbles.com.br https://img.youtube.com https://i.ytimg.com https://www.facebook.com https://*.google.com https://*.googleusercontent.com https://*.doubleclick.net https://analytics.tiktok.com https://bubbles.gabrielxavier.online; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https://cdn.shopify.com https://www.bubbles.com.br; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google.com https://*.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://analytics.tiktok.com https://www.bubbles.com.br https://wascer.bubbles.com.br https://api-admin.sellum.app https://*.clarity.ms; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://td.doubleclick.net"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Link = "</llms.txt>; rel=\"llms-txt\""
